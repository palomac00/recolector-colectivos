name: 🚌 Recolectar Horarios
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # ✅ FIX: Chrome + Driver MISMA versión
    - name: Setup Chrome con ChromeDriver compatible
      uses: nanasess/setup-chromedriver@v2
      with:
        chromedriver-version: '143.0.7499.192'  # ← EXACTA para Chrome 143
    
    - name: Install Python dependencies
      run: |
        pip install requests==2.31.0 pandas==2.2.2 openpyxl==3.1.2 pytz==2024.1 selenium
    
    - name: Run scraper (API JSON)
      timeout-minutes: 8
      run: |
        python recolector.py --once
        ls -la data/
    
    - name: Separate by days
      run: python separar_por_dias.py
      continue-on-error: true
    
    - name: Auto commit
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "📊 Línea 141 actualizada"
        file_pattern: 'data/*.xlsx data/*.txt'
