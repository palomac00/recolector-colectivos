name: 🚌 Recolectar Horarios 141
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Chrome + ChromeDriver
      uses: browser-actions/setup-chrome@v2
      with:
        install-chromedriver: true
    
    # ← CAMBIA ESTA LÍNEA (sin requirements.txt)
    - name: Install Python dependencies
      run: |
        pip install requests==2.31.0 pandas==2.2.2 openpyxl==3.1.2 pytz==2024.1

    - name: Install dependencies
     run: |
        pip install selenium pandas openpyxl pytz

    
    - name: Run scraper (API JSON)
      timeout-minutes: 8
      run: |
        python recolector.py --once
        ls -la data/
    
    - name: Separate by days
      run: python separar_por_dias.py
      continue-on-error: true
    
    - name: Auto commit
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "📊 Línea 141 actualizada"
        file_pattern: 'data/*.xlsx data/*.txt'
