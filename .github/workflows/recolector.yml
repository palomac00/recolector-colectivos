name: 🚌 Recolectar Horarios 141

on:
  schedule:
    - cron: '*/15 * * * *'  # Cada 15 minutos
  workflow_dispatch:       # Botón MANUAL

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install pandas openpyxl selenium requests
    - run: python recolector.py
    - run: python separar_por_dias.py
    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "📊 Horarios actualizados $(date +%Y-%m-%d)"
