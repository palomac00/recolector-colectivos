name: 🚌 Recolectar Horarios 141

on:
  schedule:
    - cron: '*/15 * * * *'  # Cada 15 minutos
  workflow_dispatch:        # Botón MANUAL

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pandas==2.2.2 openpyxl==3.1.2 requests pytz
        
    - name: Run recolector (SINGLE CYCLE)
      timeout-minutes: 4
      run: |
        python recolector.py --once
        ls -la horarios*
    
    - name: Separate by days
      run: python separar_por_dias.py
      continue-on-error: true
    
    - name: Auto commit changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "📊 Horarios actualizados Línea 141"
        file_pattern: '*.xlsx *.txt'
