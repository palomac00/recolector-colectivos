name: 🚍 Separar Horarios por Día

on:
  workflow_dispatch:  # ✅ Botón MANUAL en GitHub
  push:
    paths:
      - 'horarios-141-completo.xlsx'  # Solo si cambias el Excel

jobs:
  separar:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: 📦 Instalar pandas
      run: pip install pandas openpyxl pytz
      
    - name: 🔄 SEPARAR POR DÍAS
      run: python separar_por_dias.py
      
    - name: 📤 Subir archivos separados
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add horarios-141-*.xlsx
        git commit -m "📊 Separados horarios por día - $(date +%Y-%m-%d)"
        git push
